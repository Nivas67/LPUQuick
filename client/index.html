    <!-- Immediate Theme Initializer (Zero Flash) -->
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('lpuquick_theme');
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch(e) {}
        })();
    </script>
    
    
    <!-- Immediate In-App & Standalone Initializer (Zero Flash of Install UI on App) -->
    <script>
        (function() {
            try {
                var search = window.location.search || '';
                var isAppParam = search.indexOf('app=android') !== -1 || search.indexOf('source=pwa') !== -1 || search.indexOf('standalone=true') !== -1;
                var ua = navigator.userAgent || '';
                var isNativeApp = ua.indexOf('LPUQuickAndroidApp') !== -1 || ua.indexOf('LPUQuickApp') !== -1 || (/\bwv\b/.test(ua) && /Android/i.test(ua));
                var isDisplayApp = (window.matchMedia && (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: minimal-ui)').matches)) || window.navigator.standalone === true;
                var isSavedApp = localStorage.getItem('lpuquick_is_installed_app') === 'true';

                if (isAppParam || isNativeApp || isDisplayApp || isSavedApp) {
                    localStorage.setItem('lpuquick_is_installed_app', 'true');
                    document.documentElement.classList.add('is-installed-app');
                }
            } catch(e) {}
        })();
    </script>

    <!-- Hard Client Storage & Cache Purge (Preserving Auth & Address) -->
    <script>
        (function() {
            const PURGE_TAG = 'LPUQUICK_TURBO_PURGE_2026_10_03_V10';
            if (localStorage.getItem('LPUQUICK_PURGE_KEY') !== PURGE_TAG) {
                try {
                    const user = localStorage.getItem('lpuquick_user');
                    const phone = localStorage.getItem('lpuquick_phone');
                    const room = localStorage.getItem('lpuquick_room');
                    const block = localStorage.getItem('lpuquick_block');
                    const addr = localStorage.getItem('lpuquick_address');
                    const addrDetail = localStorage.getItem('lpuquick_address_detail');
                    const hostelId = localStorage.getItem('lpuquick_hostel_id');

                    sessionStorage.clear();
                    if (window.caches) {
                        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
                    }
                    if (navigator.serviceWorker) {
                        navigator.serviceWorker.getRegistrations().then(regs => {
                            regs.forEach(r => r.update());
                        });
                    }

                    if (user) localStorage.setItem('lpuquick_user', user);
                    if (phone) localStorage.setItem('lpuquick_phone', phone);
                    if (room) localStorage.setItem('lpuquick_room', room);
                    if (block) localStorage.setItem('lpuquick_block', block);
                    if (addr) localStorage.setItem('lpuquick_address', addr);
                    if (addrDetail) localStorage.setItem('lpuquick_address_detail', addrDetail);
                    if (hostelId) localStorage.setItem('lpuquick_hostel_id', hostelId);
                } catch(e){}
                localStorage.setItem('LPUQUICK_PURGE_KEY', PURGE_TAG);
            }
        })();
    </script>

    <!-- Core App State & Router Setup with Immediate Session Hydration -->
    <script>
        window.pages = window.pages || {};
        window.pageInits = window.pageInits || {};
        window.GOOGLE_CLIENT_ID = '632433440395-4ph6ghe311niied8h423ki98slbse8d2.apps.googleusercontent.com';
        
        // Permanent User Session Hydration (User stays logged in until explicit Sign Out)
        (function hydrateUserSession() {
            try {
                const savedUserStr = localStorage.getItem('lpuquick_user');
                if (savedUserStr) {
                    const savedUser = JSON.parse(savedUserStr);
                    const uid = savedUser?.id || savedUser?.user_id || savedUser?.uid;
                    if (uid) {
                        window.CURRENT_USER_ID = uid;
                        window.CURRENT_USER_NAME = savedUser.name || 'LPU Student';
                        window.CURRENT_USER_EMAIL = savedUser.email || '';
                        window.CURRENT_USER_PICTURE = savedUser.picture || '';
                        
                        // Respect user's selected theme
                        const currentTheme = localStorage.getItem('lpuquick_theme');
                        if (currentTheme === 'dark') {
                            document.documentElement.classList.add('dark');
                            if (document.body) document.body.classList.add('dark');
                        } else {
                            document.documentElement.classList.remove('dark');
                            if (document.body) document.body.classList.remove('dark');
                        }
                    }
                } else {
                    window.CURRENT_USER_ID = null;
                    window.CURRENT_USER_NAME = null;
                    window.CURRENT_USER_EMAIL = null;
                    window.CURRENT_USER_PICTURE = null;
                }
            } catch(e) {
                console.warn('[Hydrate Session Warning]:', e);
            }
        })();

        window.isUserLoggedIn = function() {
            if (Boolean(window.CURRENT_USER_ID)) return true;
            try {
                const savedUserStr = localStorage.getItem('lpuquick_user');
                if (!savedUserStr) return false;
                const savedUser = JSON.parse(savedUserStr);
                const uid = savedUser?.id || savedUser?.user_id || savedUser?.uid;
                if (uid) {
                    window.CURRENT_USER_ID = uid;
                    window.CURRENT_USER_NAME = savedUser.name || 'LPU Student';
                    window.CURRENT_USER_EMAIL = savedUser.email || '';
                    window.CURRENT_USER_PICTURE = savedUser.picture || '';
                    return true;
                }
            } catch(e) {}
            return false;
        };
    </script>
