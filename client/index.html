        (function() {
            const PURGE_TAG = 'LPUQUICK_FORCE_PURGE_V2026_08_29_FINAL';
            if (localStorage.getItem('LPUQUICK_PURGE_KEY') !== PURGE_TAG) {
                try {
                    localStorage.clear();
                    sessionStorage.clear();
                    if (window.caches) {
                        caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
                    }
                } catch(e){}
                localStorage.setItem('LPUQUICK_PURGE_KEY', PURGE_TAG);
            }
        })();
    </script>
