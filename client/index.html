<head>

                        'on-tertiary-container': '#002021',
                        'error': '#ba1a1a',
                        'on-error': '#ffffff',
                        'error-container': '#ffdad6',
                        'on-error-container': '#410002',
                        'background': '#f8f9fa',
                        'on-background': '#191c1b',
                        'surface': '#f8f9fa',

    <!-- Custom Glassmorphism Styles -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-background text-on-surface font-sans antialiased selection:bg-emerald/20 selection:text-primary relative min-h-screen">
    <!-- Ambient Animated Dynamic Campus Atmosphere Canvas -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-[-1] select-none" id="ambient-canvas" aria-hidden="true">
        <!-- Layer 1: Base Gradient Mesh -->
        <div class="ambient-base-gradient"></div>

        <!-- Layer 2: Floating Ambient Light Orbs (Top-L Mint/Green, Top-R Cyan/Blue, Mid-R Warm Pastel, Bot-L Green, Bot-R Soft Warm Pink) -->
        <div class="ambient-orb orb-top-left"></div>
        <div class="ambient-orb orb-top-right"></div>
        <div class="ambient-orb orb-mid-right"></div>
        <div class="ambient-orb orb-bot-left"></div>
        <div class="ambient-orb orb-bot-right"></div>

        <!-- Layer 3: Curved Delivery Light Trails (Smooth Glowing Paths) -->
        <svg class="ambient-delivery-trails" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <path class="trail-path trail-path-1" d="M-80 260 C 280 140, 580 460, 1080 210 C 1280 110, 1450 280, 1600 190" stroke="url(#trail-grad-1)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="14 20"/>
            <path class="trail-path trail-path-2" d="M-60 660 C 380 770, 780 460, 1180 690 C 1380 780, 1530 630, 1650 670" stroke="url(#trail-grad-2)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="10 18"/>
            <defs>
                <linearGradient id="trail-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
                    <stop offset="35%" stop-color="#10B981" stop-opacity="0.32"/>
                    <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.22"/>
                    <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="trail-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
                    <stop offset="45%" stop-color="#10B981" stop-opacity="0.28"/>
                    <stop offset="80%" stop-color="#34D399" stop-opacity="0.18"/>
                    <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
                </linearGradient>
            </defs>
        </svg>

        <!-- Layer 4: Floating Micro-Particles (Gentle Glowing Specks) -->
        <div class="ambient-particle particle-1"></div>
        <div class="ambient-particle particle-2"></div>
        <div class="ambient-particle particle-3"></div>
        <div class="ambient-particle particle-4"></div>
        <div class="ambient-particle particle-5"></div>
        <div class="ambient-particle particle-6"></div>
        <div class="ambient-particle particle-7"></div>
        <div class="ambient-particle particle-8"></div>

        <!-- Layer 5: Occasional 4-Point Star Sparkles -->
        <div class="ambient-sparkle sparkle-1">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z"/></svg>
        </div>
        <div class="ambient-sparkle sparkle-2">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z"/></svg>
        </div>
        <div class="ambient-sparkle sparkle-3">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z"/></svg>
        </div>
        <div class="ambient-sparkle sparkle-4">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z"/></svg>
        </div>

        <!-- Layer 6: Subtle Floating Fresh Leaves -->
        <div class="ambient-leaf leaf-1">
            <svg viewBox="0 0 32 32" fill="currentColor"><path d="M27 5C20 4 11 9 7 15C3 21 4 28 4 28C4 28 11 29 17 25C23 21 28 12 27 5ZM14.8 17.2C12.4 19.6 8.5 22.8 8.5 22.8C8.5 22.8 11.7 18.9 14.1 16.5C16.5 14.1 20.4 10.9 20.4 10.9C20.4 10.9 17.2 14.8 14.8 17.2Z"/></svg>
        </div>
        <div class="ambient-leaf leaf-2">
            <svg viewBox="0 0 32 32" fill="currentColor"><path d="M27 5C20 4 11 9 7 15C3 21 4 28 4 28C4 28 11 29 17 25C23 21 28 12 27 5ZM14.8 17.2C12.4 19.6 8.5 22.8 8.5 22.8C8.5 22.8 11.7 18.9 14.1 16.5C16.5 14.1 20.4 10.9 20.4 10.9C20.4 10.9 17.2 14.8 14.8 17.2Z"/></svg>
        </div>
        <div class="ambient-leaf leaf-3">
            <svg viewBox="0 0 32 32" fill="currentColor"><path d="M27 5C20 4 11 9 7 15C3 21 4 28 4 28C4 28 11 29 17 25C23 21 28 12 27 5ZM14.8 17.2C12.4 19.6 8.5 22.8 8.5 22.8C8.5 22.8 11.7 18.9 14.1 16.5C16.5 14.1 20.4 10.9 20.4 10.9C20.4 10.9 17.2 14.8 14.8 17.2Z"/></svg>
        </div>

        <!-- Layer 7: Gentle Breathing Matrix Grid Overlay -->
        <div class="ambient-grid-overlay"></div>
    </div>

    <!-- SPA Root Container -->
    <div id="app"></div>

    <!-- Global Floating Live Delivery Bar (Shows across all store pages when an order is active) -->
    <div id="global-live-delivery-bar" class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-40 hidden transition-all duration-300">
        <a href="#/orders" class="glass-card p-3 rounded-2xl border border-emerald/40 shadow-2xl bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl flex items-center justify-between gap-3 text-xs hover:border-emerald transition-all active:scale-[0.98]">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-8 h-8 rounded-full bg-emerald text-white flex items-center justify-center font-bold flex-shrink-0 animate-bounce">
                    <span class="material-symbols-outlined text-base">directions_walk</span>
                </div>
                <div class="truncate">
                    <div class="flex items-center gap-1.5 font-bold text-on-surface">
                        <span class="w-2 h-2 rounded-full bg-emerald animate-pulse"></span>
                        <span id="global-delivery-status">Out for Delivery</span>
                        <span class="text-[10px] text-emerald font-extrabold bg-emerald/10 px-1.5 py-0.2 rounded-full" id="global-delivery-eta">1 min</span>
                    </div>
                    <p class="text-[10px] text-on-surface-variant truncate mt-0.5" id="global-delivery-subtitle">
                        Campus runner walking to BH13 (Block A), Room 304
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-1 text-emerald font-bold text-xs flex-shrink-0">
                <span>Live Map</span>
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </div>
        </a>
    </div>

    <script src="/js/pages/orders.js"></script>
    <script src="/js/pages/settings.js"></script>

    <!-- App Router -->
    <script src="/js/app.js"></script>
</body>
</html>
