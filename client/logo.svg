<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Emerald Theme Gradient -->
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Speed Streaks Yellow / Mint Gradient -->
    <linearGradient id="speedGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(0,0,0,0.22)"/>
    </filter>
  </defs>

  <!-- Squircle Base with App Theme Emerald -->
  <rect width="512" height="512" rx="120" fill="url(#emeraldBg)"/>

  <!-- Speed Motion Trails on the Left -->
  <g filter="url(#logoShadow)">
    <!-- Trail 1 -->
    <circle cx="108" cy="176" r="10" fill="url(#speedGold)"/>
    <rect x="116" y="166" width="32" height="20" rx="10" fill="url(#speedGold)"/>
    
    <!-- Trail 2 -->
    <rect x="76" y="198" width="68" height="22" rx="11" fill="url(#speedGold)"/>
    
    <!-- Trail 3 -->
    <rect x="44" y="230" width="94" height="24" rx="12" fill="url(#speedGold)"/>
    
    <!-- Trail 4 -->
    <rect x="70" y="262" width="68" height="22" rx="11" fill="url(#speedGold)"/>
    
    <!-- Trail 5 -->
    <circle cx="116" cy="294" r="9" fill="url(#speedGold)"/>
  </g>

  <!-- Main "LPU" Brand Lettering (Bold, Slanted/Italic, Pure White) -->
  <g filter="url(#logoShadow)" transform="skewX(-10) translate(30, 0)">
    <!-- Letter L -->
    <path d="M 175 160 L 220 160 L 202 260 L 255 260 L 248 296 L 152 296 Z" fill="#FFFFFF"/>

    <!-- Letter P -->
    <path d="M 238 160 L 315 160 C 355 160, 365 185, 355 220 C 345 255, 320 266, 280 266 L 255 266 L 249 296 L 210 296 Z" fill="#FFFFFF"/>
    
    <!-- Cutout inside P -->
    <path d="M 268 190 L 305 190 C 322 190, 328 198, 322 216 C 316 234, 305 240, 288 240 L 257 240 Z" fill="url(#emeraldBg)"/>
    
    <!-- Speed Plane / Arrowhead in P loop -->
    <polygon points="275,198 322,216 270,234 285,216" fill="url(#speedGold)"/>

    <!-- Letter U -->
    <path d="M 370 160 L 410 160 L 396 235 C 390 265, 375 298, 325 298 C 285 298, 280 270, 285 250 L 322 250 C 320 262, 325 268, 342 268 C 360 268, 366 256, 368 235 Z" fill="#FFFFFF"/>
  </g>

  <!-- Subtitle: "- QUICK -" with Golden Hyphens -->
  <g filter="url(#logoShadow)">
    <!-- Left Hyphen -->
    <rect x="82" y="348" width="46" height="10" rx="5" fill="url(#speedGold)"/>
    
    <!-- Text: QUICK in clean bold tracked lettering -->
    <text x="256" y="362" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="18">QUICK</text>
    
    <!-- Right Hyphen -->
    <rect x="384" y="348" width="46" height="10" rx="5" fill="url(#speedGold)"/>
  </g>
</svg>
