<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPUQuick Admin — Mobile Phone Simulator</title>
    <script>
        (function() {
            // Real-World Mobile Fullscreen Enforcement:
            // When opened on any mobile phone or touch screen (<= 820px),
            // immediately bypass the testing simulator frame and load the real-world full-screen app!
            const isMobileScreen = window.innerWidth <= 820 || window.screen.width <= 820;
            const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(navigator.userAgent);
            const isTouchMobile = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && isMobileScreen;
            const urlParams = new URLSearchParams(window.location.search);
            const forceSimulator = urlParams.has('simulator');

            if ((isMobileScreen || isMobileUA || isTouchMobile) && !forceSimulator) {
                window.location.replace('/admin/' + window.location.search + window.location.hash);
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #111827;
            --surface-card: #1f2937;
            --border: #374151;
            --brand: #2563eb;
            --brand-glow: rgba(37, 99, 235, 0.35);
            --emerald: #10b981;
            --text: #f9fafb;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #090d16 65%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-navbar {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            z-index: 100;
            flex-shrink: 0;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(37, 99, 235, 0.18);
            border: 1px solid rgba(59, 130, 246, 0.45);
            color: #60a5fa;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            font-size: 10px;
            font-weight: 800;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 6px #34d399;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .controls-cluster {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
        }

        .btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.18s ease;
            user-select: none;
            text-decoration: none;
            font-family: inherit;
        }

        .btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn.active {
            background: var(--brand);
            color: #ffffff;
            box-shadow: 0 2px 10px var(--brand-glow);
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
        }

        .btn-action:hover {
            background: rgba(37, 99, 235, 0.25);
            border-color: rgba(59, 130, 246, 0.5);
            color: #ffffff;
        }

        /* Quick Actions Bar */
        .quick-actions-bar {
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 90;
        }

        .quick-label {
            font-size: 10px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 4px;
        }

        .quick-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quick-pill:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .quick-pill.accent {
            background: rgba(37, 99, 235, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
            color: #93c5fd;
        }

        .quick-pill.accent:hover {
            background: rgba(37, 99, 235, 0.3);
            color: #ffffff;
        }

        /* Simulator Stage */
        .simulator-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 12px;
            position: relative;
        }

        .simulator-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Phone Mockup Frame */
        .phone-wrapper {
            position: relative;
            background: #000000;
            border-radius: 54px;
            box-shadow: 
                0 0 0 2px #475569,
                0 0 0 8px #0f172a,
                0 0 0 11px #334155,
                0 25px 70px -15px rgba(0, 0, 0, 0.85),
                0 0 50px rgba(37, 99, 235, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            transition: width 0.3s ease, height 0.3s ease;
        }

        /* Hardware Buttons Simulation */
        .phone-wrapper::before {
            content: '';
            position: absolute;
            left: -13px;
            top: 110px;
            width: 3px;
            height: 48px;
            background: #64748b;
            border-radius: 2px 0 0 2px;
        }
        .phone-wrapper::after {
            content: '';
            position: absolute;
            right: -13px;
            top: 130px;
            width: 3px;
            height: 60px;
            background: #64748b;
            border-radius: 0 2px 2px 0;
        }

        /* Top Notch / Status Bar */
        .phone-status-bar {
            height: 42px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .status-time {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
        }

        /* Dynamic Island */
        .dynamic-island {
            width: 110px;
            height: 28px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
        }

        .island-label {
            font-size: 9px;
            font-weight: 800;
            color: #60a5fa;
            letter-spacing: 0.05em;
        }

        .island-camera {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #030712;
            border: 1px solid #1e293b;
            box-shadow: inset 0 0 3px #38bdf8;
        }

        /* Phone Screen Viewport */
        .phone-screen-body {
            flex: 1;
            position: relative;
            background: #ffffff;
            overflow: hidden;
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Phone Home Area */
        .phone-home-area {
            height: 18px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .home-bar {
            width: 130px;
            height: 4px;
            background: #0f172a;
            border-radius: 9999px;
            opacity: 0.7;
        }

        /* Mobile Device Responsive Overrides: If opened on real smartphone, strip phone mockup and fill screen natively */
        @media (max-width: 767px) {
            html, body {
                padding: 0 !important;
                margin: 0 !important;
                overflow: hidden !important;
                height: 100vh !important;
                height: 100dvh !important;
                background: #F1F3F4 !important;
            }
            .top-navbar, .quick-actions-bar {
                display: none !important;
            }
            .simulator-viewport {
                padding: 0 !important;
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }
            .simulator-stage {
                transform: none !important;
                width: 100% !important;
                height: 100% !important;
            }
            .phone-wrapper {
                width: 100% !important;
                height: 100% !important;
                max-height: 100% !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }
            .phone-wrapper::before, .phone-wrapper::after {
                display: none !important;
            }
            .phone-status-bar, .phone-home-area {
                display: none !important;
            }
            .phone-screen-body {
                width: 100% !important;
                height: 100% !important;
                border-radius: 0 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Toolbar -->
    <header class="top-navbar">
        <div class="brand-cluster">
            <span class="brand-badge">
                <span class="material-symbols-outlined" style="font-size: 15px;">smartphone</span>
                Admin Mobile Simulator
            </span>
            <a href="/admin/" class="btn" style="background: #10b981; color: white; font-weight: 800; border: none; text-decoration: none; padding: 5px 14px; border-radius: 9999px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 2px 8px rgba(16,185,129,0.35);" title="Open Real World Full Screen Admin without simulator frame">
                <span class="material-symbols-outlined" style="font-size: 14px;">open_in_new</span>
                Real Mobile Fullscreen (Direct)
            </a>
            <span class="live-pill">
                <span class="live-dot"></span>
                Live Sync
            </span>
        </div>

        <div class="controls-cluster">
            <!-- Device Size Selector -->
            <div class="control-group">
                <button class="btn active" id="dev-iphone" onclick="setDevice(393, 852, 'dev-iphone')">
                    <span class="material-symbols-outlined" style="font-size: 13px;">smartphone</span>
                    iPhone 15 Pro
                </button>
                <button class="btn" id="dev-pixel" onclick="setDevice(412, 915, 'dev-pixel')">
                    Pixel 8
                </button>
                <button class="btn" id="dev-se" onclick="setDevice(375, 667, 'dev-se')">
                    iPhone SE
                </button>
            </div>

            <!-- Viewport Zoom Controls -->
            <div class="control-group">
                <button class="btn active" id="zoom-auto" onclick="setZoomMode('auto', this)" title="Automatically scales phone to fit your laptop screen perfectly">
                    <span class="material-symbols-outlined" style="font-size: 13px;">fit_screen</span>
                    Auto Fit
                </button>
                <button class="btn" id="zoom-80" onclick="setZoomMode(0.8, this)">80%</button>
                <button class="btn" id="zoom-100" onclick="setZoomMode(1.0, this)">100%</button>
            </div>

            <!-- Frame Actions -->
            <button class="btn btn-action" onclick="reloadFrame()" title="Reload phone frame">
                <span class="material-symbols-outlined" style="font-size: 14px;">refresh</span>
                Reload
            </button>
            <a href="/admin/" target="_blank" class="btn btn-action" title="Open admin directly in full browser tab">
                <span class="material-symbols-outlined" style="font-size: 14px;">open_in_new</span>
                Direct Tab
            </a>
        </div>
    </header>

    <!-- Quick Navigation Shortcuts -->
    <nav class="quick-actions-bar">
        <span class="quick-label">Remote Controls:</span>
        <button class="quick-pill accent" onclick="remoteAction('toggleMenu')" title="Toggle mobile navigation menu drawer">
            <span class="material-symbols-outlined" style="font-size: 14px;">menu</span>
            Toggle Drawer
        </button>
        <button class="quick-pill" onclick="remoteAction('switchView', 'dashboard')">
            <span class="material-symbols-outlined" style="font-size: 14px;">dashboard</span>
            Overview
        </button>
        <button class="quick-pill" onclick="remoteAction('switchView', 'orders')">
            <span class="material-symbols-outlined" style="font-size: 14px;">receipt_long</span>
            Orders
        </button>
        <button class="quick-pill" onclick="remoteAction('switchView', 'inventory')">
            <span class="material-symbols-outlined" style="font-size: 14px;">inventory_2</span>
            Stock
        </button>
        <button class="quick-pill" onclick="remoteAction('switchView', 'earnings')">
            <span class="material-symbols-outlined" style="font-size: 14px;">sports_motorsports</span>
            Delivery
        </button>
        <button class="quick-pill" onclick="remoteAction('switchView', 'products')">
            <span class="material-symbols-outlined" style="font-size: 14px;">shopping_bag</span>
            Products
        </button>
        <button class="quick-pill" onclick="remoteAction('switchView', 'client-lock')">
            <span class="material-symbols-outlined" style="font-size: 14px;">lock_clock</span>
            Store Lock
        </button>
        <button class="quick-pill" onclick="remoteAction('switchView', 'customers')">
            <span class="material-symbols-outlined" style="font-size: 14px;">group</span>
            Customers
        </button>
    </nav>

    <!-- Phone Simulator Viewport Container -->
    <main class="simulator-viewport" id="simulator-viewport">
        <div class="simulator-stage" id="simulator-stage">
            <div class="phone-wrapper" id="phone-wrapper" style="width: 393px; height: 852px;">
                <!-- Status Bar with Time, Dynamic Island & Signal -->
                <div class="phone-status-bar">
                    <div class="status-time" id="status-clock">9:41</div>
                    <div class="dynamic-island">
                        <span class="island-label">ADMIN</span>
                        <div class="island-camera"></div>
                    </div>
                    <div class="status-icons">
                        <span style="font-size: 10px;">5G</span>
                        <span class="material-symbols-outlined" style="font-size: 14px;">wifi</span>
                        <span class="material-symbols-outlined" style="font-size: 14px;">battery_full</span>
                    </div>
                </div>

                <!-- Admin Dashboard Iframe Screen -->
                <div class="phone-screen-body">
                    <iframe id="admin-frame" src="/admin/" allow="autoplay; clipboard-write"></iframe>
                </div>

                <!-- Bottom Home Bar Area -->
                <div class="phone-home-area">
                    <div class="home-bar"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentZoomMode = 'auto';
        let currentDeviceW = 393;
        let currentDeviceH = 852;

        // Status Bar Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            hours = hours % 12 || 12;
            const el = document.getElementById('status-clock');
            if (el) el.textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Calculate and Apply Auto-Fit Scale
        function applyAutoFit() {
            if (currentZoomMode !== 'auto') return;

            const viewport = document.getElementById('simulator-viewport');
            const stage = document.getElementById('simulator-stage');
            const wrapper = document.getElementById('phone-wrapper');
            if (!viewport || !stage || !wrapper) return;

            // Give a generous 48px margin around the viewport so the phone is never clipped
            const availableW = Math.max(280, viewport.clientWidth - 48);
            const availableH = Math.max(280, viewport.clientHeight - 48);

            // Total physical phone dimensions including status notch (42px) + home-bar (18px) + outer borders/shadows (28px)
            const totalPhoneW = currentDeviceW + 28;
            const totalPhoneH = currentDeviceH + 60 + 28;

            const scaleW = availableW / totalPhoneW;
            const scaleH = availableH / totalPhoneH;

            // Pick scale that fits both dimensions cleanly with padding
            let targetScale = Math.min(scaleW, scaleH);
            targetScale = Math.max(0.35, Math.min(targetScale, 1.0));

            stage.style.transform = `scale(${targetScale})`;
        }

        // Window resize event for dynamic Auto-Fit
        window.addEventListener('resize', () => {
            if (currentZoomMode === 'auto') {
                applyAutoFit();
            }
        });

        // Device Switcher
        function setDevice(w, h, btnId) {
            currentDeviceW = w;
            currentDeviceH = h;
            const wrapper = document.getElementById('phone-wrapper');
            if (wrapper) {
                wrapper.style.width = w + 'px';
                wrapper.style.height = h + 'px';
            }

            ['dev-iphone', 'dev-pixel', 'dev-se'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('active');
            });
            const activeBtn = document.getElementById(btnId);
            if (activeBtn) activeBtn.classList.add('active');

            if (currentZoomMode === 'auto') {
                applyAutoFit();
            }
        }

        // Zoom Switcher
        function setZoomMode(mode, btn) {
            currentZoomMode = mode;
            const stage = document.getElementById('simulator-stage');

            if (btn && btn.parentElement) {
                btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            if (mode === 'auto') {
                applyAutoFit();
            } else {
                stage.style.transform = `scale(${mode})`;
            }
        }

        // Reload Frame
        function reloadFrame() {
            const frame = document.getElementById('admin-frame');
            if (frame) {
                frame.src = '/admin/?t=' + Date.now();
            }
        }

        // Remote Action into the Admin Frame
        function remoteAction(type, arg) {
            const frame = document.getElementById('admin-frame');
            if (!frame || !frame.contentWindow) return;

            try {
                if (type === 'toggleMenu') {
                    if (typeof frame.contentWindow.toggleMobileMenu === 'function') {
                        frame.contentWindow.toggleMobileMenu();
                    }
                } else if (type === 'switchView') {
                    if (typeof frame.contentWindow.switchView === 'function') {
                        frame.contentWindow.switchView(arg);
                    }
                }
            } catch (e) {
                console.warn('Remote action error:', e);
            }
        }

        // Initialize Auto-Fit once DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            applyAutoFit();
            setTimeout(applyAutoFit, 100);
            setTimeout(applyAutoFit, 300);
        });
    </script>
</body>
</html>
