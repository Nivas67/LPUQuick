<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="flowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <g>
    <!-- Outer Dynamic Speed Ring -->
    <path d="M 330 160 C 290 115, 210 115, 160 165 C 105 220, 105 310, 160 365 C 215 420, 305 420, 360 365 C 400 325, 410 260, 385 210" 
          fill="none" 
          stroke="url(#neonGreen)" 
          stroke-width="50" 
          stroke-linecap="round"/>

    <!-- Sharp Speed Lightning Tail -->
    <path d="M 280 280 L 395 395 M 335 395 L 395 395 L 395 335" 
          fill="none" 
          stroke="url(#flowAccent)" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <circle cx="256" cy="256" r="28" fill="#FCD34D"/>
  </g>
</svg>
