<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LPUQuick Storefront — Mobile Device Simulator</title>
    <script>
        (function() {
            // Real-World Mobile Auto-Redirect:
            // When opened directly on any real phone/touch device (<= 820px),
            // immediately bypass the desktop phone frame and load the real fullscreen customer app!
            const isMobileScreen = window.innerWidth <= 820 || window.screen.width <= 820;
            const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(navigator.userAgent);
            const isTouchMobile = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && isMobileScreen;
            const urlParams = new URLSearchParams(window.location.search);
            const forceSimulator = urlParams.has('simulator');

            if ((isMobileScreen || isMobileUA || isTouchMobile) && !forceSimulator) {
                window.location.replace('/#' + (window.location.hash.replace(/^#/, '') || '/'));
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060911;
            --surface: #0c1220;
            --surface-card: #151d30;
            --border: rgba(255, 255, 255, 0.08);
            --emerald: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.35);
            --text: #f9fafb;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background: radial-gradient(circle at 50% 15%, #064e3b 0%, #060911 70%);
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-navbar {
            background: rgba(12, 18, 32, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            z-index: 100;
            flex-shrink: 0;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            font-size: 10px;
            font-weight: 800;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .controls-cluster {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
        }

        .btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 11px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.18s ease;
            user-select: none;
            text-decoration: none;
            font-family: inherit;
        }

        .btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }

        .btn.active {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 2px 10px var(--emerald-glow);
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
        }

        .btn-action:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.5);
            color: #ffffff;
        }

        /* Quick Navigation Shortcuts */
        .quick-actions-bar {
            background: rgba(12, 18, 32, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
            z-index: 90;
        }

        .quick-label {
            font-size: 10px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 4px;
        }

        .quick-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quick-pill:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .quick-pill.accent {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        .quick-pill.accent:hover {
            background: rgba(16, 185, 129, 0.3);
            color: #ffffff;
        }

        /* Simulator Stage */
        .simulator-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 14px;
            position: relative;
        }

        .simulator-stage {
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Phone Mockup Frame */
        .phone-wrapper {
            position: relative;
            background: #000000;
            border-radius: 50px;
            box-shadow: 
                0 0 0 2.5px #f59e0b,
                0 0 0 6px #0c0618,
                0 0 0 8.5px rgba(217, 119, 6, 0.6),
                0 25px 70px -15px rgba(0, 0, 0, 0.95),
                0 0 45px rgba(245, 158, 11, 0.45);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            transition: width 0.3s ease, height 0.3s ease;
        }

        /* Hardware Side Buttons Simulation */
        .phone-wrapper::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 110px;
            width: 3px;
            height: 44px;
            background: #475569;
            border-radius: 2px 0 0 2px;
        }
        .phone-wrapper::after {
            content: '';
            position: absolute;
            right: -12px;
            top: 125px;
            width: 3px;
            height: 56px;
            background: #475569;
            border-radius: 0 2px 2px 0;
        }

        /* Top Status Bar */
        .phone-status-bar {
            height: 40px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .status-time {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
        }

        /* Dynamic Camera Pill / Camera Cutout */
        .phone-notch {
            width: 90px;
            height: 24px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        .notch-label {
            font-size: 8px;
            font-weight: 900;
            color: #34d399;
            letter-spacing: 0.06em;
        }

        .notch-lens {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #020617;
            border: 1px solid #1e293b;
            box-shadow: inset 0 0 3px #10b981;
        }

        /* Phone Screen Viewport */
        .phone-screen-body {
            flex: 1;
            position: relative;
            background: #0f172a;
            overflow: hidden;
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0f172a;
        }

        /* Phone Home Area */
        .phone-home-area {
            height: 18px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .home-bar {
            width: 125px;
            height: 4px;
            background: #ffffff;
            border-radius: 9999px;
            opacity: 0.6;
        }

        /* Direct mobile fullscreen override */
        @media (max-width: 767px) {
            html, body {
                padding: 0 !important;
                margin: 0 !important;
                overflow: hidden !important;
                height: 100vh !important;
                height: 100dvh !important;
            }
            .top-navbar, .quick-actions-bar {
                display: none !important;
            }
            .simulator-viewport {
                padding: 0 !important;
                width: 100% !important;
                height: 100% !important;
            }
            .simulator-stage {
                transform: none !important;
                width: 100% !important;
                height: 100% !important;
            }
            .phone-wrapper {
                width: 100% !important;
                height: 100% !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }
            .phone-wrapper::before, .phone-wrapper::after,
            .phone-status-bar, .phone-home-area {
                display: none !important;
            }
            .phone-screen-body {
                width: 100% !important;
                height: 100% !important;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Toolbar -->
    <header class="top-navbar">
        <div class="brand-cluster">
            <span class="brand-badge">
                <span class="material-symbols-outlined" style="font-size: 15px;">smartphone</span>
                LPUQuick Mobile View
            </span>
            <a href="/#/" class="btn" style="background: #10b981; color: white; font-weight: 800; border: none; text-decoration: none; padding: 5px 14px; border-radius: 9999px; font-size: 11px; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 2px 8px rgba(16,185,129,0.35);" title="Open Direct Fullscreen in this tab">
                <span class="material-symbols-outlined" style="font-size: 14px;">open_in_new</span>
                Open Direct Fullscreen (/#/)
            </a>
            <span class="live-pill">
                <span class="live-dot"></span>
                Fresh Build V4
            </span>
        </div>

        <div class="controls-cluster">
            <!-- Mobile Form Factor Presets -->
            <div class="control-group">
                <button class="btn active" id="dev-android-360" onclick="setDevice(360, 780, 'dev-android-360')" title="Galaxy A14 / Standard 360px Android display">
                    <span class="material-symbols-outlined" style="font-size: 13px;">android</span>
                    Android (360px)
                </button>
                <button class="btn" id="dev-pixel" onclick="setDevice(412, 915, 'dev-pixel')" title="Pixel 8 / Galaxy S24 (412px)">
                    <span class="material-symbols-outlined" style="font-size: 13px;">devices</span>
                    Pixel 8 (412px)
                </button>
                <button class="btn" id="dev-iphone" onclick="setDevice(393, 852, 'dev-iphone')" title="iPhone 15 / 16 (393px)">
                    iPhone (393px)
                </button>
            </div>

            <!-- Auto-Fit Zoom Controls -->
            <div class="control-group">
                <button class="btn active" id="zoom-auto" onclick="setZoomMode('auto', this)" title="Fits phone frame inside your browser window">
                    <span class="material-symbols-outlined" style="font-size: 13px;">fit_screen</span>
                    Auto Fit
                </button>
                <button class="btn" id="zoom-85" onclick="setZoomMode(0.85, this)">85%</button>
                <button class="btn" id="zoom-100" onclick="setZoomMode(1.0, this)">100%</button>
            </div>

            <!-- Frame Actions -->
            <button class="btn btn-action" onclick="reloadFrame()" title="Force hard reload customer app in phone frame">
                <span class="material-symbols-outlined" style="font-size: 14px;">cached</span>
                Hard Refresh
            </button>
        </div>
    </header>

    <!-- Quick Navigation Bar -->
    <nav class="quick-actions-bar">
        <span class="quick-label">Jump to Section:</span>
        <button class="quick-pill accent" onclick="navigateFrame('#/')" title="Go to Storefront Home">
            <span class="material-symbols-outlined" style="font-size: 14px;">home</span>
            All Products
        </button>
        <button class="quick-pill" onclick="navigateFrame('#/?category=lpq-food')" title="Jump to Cooked Food Section">
            <span class="material-symbols-outlined" style="font-size: 14px;">ramen_dining</span>
            Quick Food (Cooked)
        </button>
        <button class="quick-pill" onclick="navigateFrame('#/?category=biscuits')" title="Jump to Biscuits">
            <span class="material-symbols-outlined" style="font-size: 14px;">cookie</span>
            Biscuits
        </button>
        <button class="quick-pill" onclick="navigateFrame('#/?category=chips')" title="Jump to Chips">
            <span class="material-symbols-outlined" style="font-size: 14px;">lunch_dining</span>
            Chips
        </button>
        <button class="quick-pill" onclick="navigateFrame('#/cart')" title="Go to Cart">
            <span class="material-symbols-outlined" style="font-size: 14px;">shopping_bag</span>
            Cart
        </button>
    </nav>

    <!-- Simulator Viewport -->
    <main class="simulator-viewport" id="simulator-viewport">
        <div class="simulator-stage" id="simulator-stage">
            <div class="phone-wrapper" id="phone-wrapper" style="width: 360px; height: 780px;">
                <!-- Status Bar with Time & Camera Notch -->
                <div class="phone-status-bar">
                    <div class="status-time" id="status-clock">10:20</div>
                    <div class="phone-notch">
                        <span class="notch-label">LPUQUICK</span>
                        <div class="notch-lens"></div>
                    </div>
                    <div class="status-icons">
                        <span style="font-size: 10px;">5G</span>
                        <span class="material-symbols-outlined" style="font-size: 14px;">wifi</span>
                        <span class="material-symbols-outlined" style="font-size: 14px;">battery_full</span>
                    </div>
                </div>

                <!-- Customer Storefront Iframe -->
                <div class="phone-screen-body">
                    <iframe id="store-frame" src="/?v=20261106_diwali_v7#/" allow="autoplay; clipboard-write; geolocation"></iframe>
                </div>

                <!-- Bottom Home Bar -->
                <div class="phone-home-area">
                    <div class="home-bar"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentZoomMode = 'auto';
        let currentDeviceW = 360;
        let currentDeviceH = 780;

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            hours = hours % 12 || 12;
            const el = document.getElementById('status-clock');
            if (el) el.textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function applyAutoFit() {
            if (currentZoomMode !== 'auto') return;
            const viewport = document.getElementById('simulator-viewport');
            const stage = document.getElementById('simulator-stage');
            const wrapper = document.getElementById('phone-wrapper');
            if (!viewport || !stage || !wrapper) return;

            const availW = viewport.clientWidth - 32;
            const availH = viewport.clientHeight - 32;
            const scaleW = availW / (currentDeviceW + 24);
            const scaleH = availH / (currentDeviceH + 24);
            let finalScale = Math.min(scaleW, scaleH, 1.0);
            if (finalScale < 0.45) finalScale = 0.45;

            stage.style.transform = `scale(${finalScale.toFixed(3)})`;
        }

        window.addEventListener('resize', applyAutoFit);

        function setDevice(w, h, btnId) {
            currentDeviceW = w;
            currentDeviceH = h;
            const wrapper = document.getElementById('phone-wrapper');
            if (wrapper) {
                wrapper.style.width = w + 'px';
                wrapper.style.height = h + 'px';
            }
            document.querySelectorAll('.control-group button').forEach(b => {
                if (b.id && b.id.startsWith('dev-')) b.classList.remove('active');
            });
            const activeBtn = document.getElementById(btnId);
            if (activeBtn) activeBtn.classList.add('active');

            applyAutoFit();
        }

        function setZoomMode(mode, btnEl) {
            currentZoomMode = mode;
            const stage = document.getElementById('simulator-stage');
            if (btnEl) {
                btnEl.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                btnEl.classList.add('active');
            }

            if (mode === 'auto') {
                applyAutoFit();
            } else {
                stage.style.transform = `scale(${mode})`;
            }
        }

        function reloadFrame() {
            const frame = document.getElementById('store-frame');
            if (frame) {
                const currentHash = frame.contentWindow ? frame.contentWindow.location.hash : '#/';
                frame.src = `/?nocache=${Date.now()}${currentHash}`;
            }
        }

        function navigateFrame(targetUrl) {
            const frame = document.getElementById('store-frame');
            if (frame) {
                frame.src = targetUrl;
            }
        }

        // Initialize fit
        setTimeout(applyAutoFit, 100);
    </script>
</body>
</html>
