<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Primary Neon Emerald Stroke Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Accent Flow Gradient (Emerald to Cyber Purple) -->
    <linearGradient id="flowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Luxury Obsidian-Emerald Tint -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Internal Border -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- Glowing Ambient Radial Background -->
  <circle cx="256" cy="256" r="180" fill="#10B981" opacity="0.12" filter="blur(30px)"/>

  <!-- Minimalist Aerodynamic "Q" / "Flow" Vector Glyph -->
  <g filter="url(#softGlow)">
    <!-- Outer Dynamic Speed Ring -->
    <path d="M 330 160 C 290 115, 210 115, 160 165 C 105 220, 105 310, 160 365 C 215 420, 305 420, 360 365 C 400 325, 410 260, 385 210" 
          fill="none" 
          stroke="url(#neonGreen)" 
          stroke-width="42" 
          stroke-linecap="round"/>

    <!-- Sharp Speed Lightning Tail / Flow Arrow -->
    <path d="M 285 285 L 395 395 M 345 395 L 395 395 L 395 345" 
          fill="none" 
          stroke="url(#flowAccent)" 
          stroke-width="42" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Speed Core Dot -->
    <circle cx="256" cy="256" r="24" fill="#FCD34D"/>
  </g>
</svg>
