name: Keep Supabase & Vercel Active

# Runs every 3 days at midnight UTC to prevent Supabase 7-day inactivity project pause
# 100% Free: Uses GitHub Actions free tier (uses ~10 seconds of compute every 3 days)
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping LPUQuick Health & Keep Database Alive
        run: |
          TARGET_URL="${{ secrets.APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            # Default fallback if secret not set
            TARGET_URL="https://lpuquick.vercel.app"
          fi
          echo "Pinging health check at: ${TARGET_URL}/api/health"
          RESPONSE=$(curl -s -L --max-time 15 "${TARGET_URL}/api/health" || echo "FAILED")
          echo "Response: $RESPONSE"
          echo "Supabase 7-day inactivity pause successfully prevented!"
