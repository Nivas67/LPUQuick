name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/LPUQuick.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LPUQuick-APK
          path: release-apk/LPUQuick.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: LPUQuick Official Android App v1.0.0
          body: |
            ### 🚀 LPUQuick Official Android App (.apk)
            Real native Android application for 3-minute LPU campus hostel delivery.
            
            - **Package Name**: `com.lpuquick.app`
            - **Features**: Fast ordering, live status tracking, zero address bar, edge-to-edge fullscreen.
            - **Installation**: Download `LPUQuick.apk` directly to your phone and tap to install.
          files: release-apk/LPUQuick.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
