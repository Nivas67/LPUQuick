# ==============================================================================
# LPUQuick Production High-Performance Nginx Load Balancer Configuration
# ==============================================================================
# Distributes traffic across multiple Node.js application instances or cluster
# nodes with round-robin / least_conn load balancing, zero-latency WebSocket proxying,
# SSL termination, and automated HTTP keep-alive connection pooling.
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Upstream Node.js Load Balancing Pool
    upstream lpuquick_backend {
        # least_conn distributes requests to the worker with the fewest active connections
        least_conn;

        # Local Node.js cluster / worker instances
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s backup;

        # Keep-alive connection pooling to prevent socket exhaustion
        keepalive 64;
    }

    # Logging
    log_format main_loadbalancer '$remote_addr - $remote_user [$time_local] "$request" '
                                 '$status $body_bytes_sent "$http_referer" '
                                 '"$http_user_agent" "$http_x_forwarded_for" '
                                 'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/lpuquick_access.log main_loadbalancer;
    error_log  /var/log/nginx/lpuquick_error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        server_name lpuquick.com www.lpuquick.com;

        # Redirect HTTP to HTTPS (When SSL is configured)
        # return 301 https://$host$request_uri;

        # Real Client IP resolution (Cloudflare or Upstream CDN)
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        real_ip_header CF-Connecting-IP;

        # Client Body Constraints
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # WebSocket Endpoints Load Balancing
        location /ws/ {
            proxy_pass http://lpuquick_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket long-lived keepalive timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Static Assets Edge Caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://lpuquick_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 30d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        # All API & Web Traffic (Load-Balanced across upstream pool)
        location / {
            proxy_pass http://lpuquick_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Next upstream failover
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
